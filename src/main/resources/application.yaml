spring:
  application:
    name: cookbook

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${PORT:8080}

cookbook:
  images-dir: ${COOKBOOK_IMAGES_DIR:${user.home}/cookbook-images}

  deepl:
    api-key: ${DEEPL_API_KEY:}